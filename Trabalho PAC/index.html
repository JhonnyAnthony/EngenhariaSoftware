<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <!-- CSS -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px black;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: rgba(0, 0, 212, 0.719);
        }

        #resultado {
            margin-top: 20px;
            background: #e9e9e9;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Cadastro</h1>
        <!-- Formulário de cadastro -->
        <form id="formCadastro">
            <!-- Input para Nome -->
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome"placeholder="Digite seu nome"requiredminlength="3">
            
            <!-- Input para E-mail -->
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"placeholder="Digite seu e-mail"required>

            <!-- Input para idade -->
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade"placeholder="Digite sua idade"requiredmin="0"max="120">
            <!-- Botão de envio -->
            <button type="submit">Cadastrar</button>
        </form>
        <!-- Aqui vai ficar o resultado das pesquisas -->
        <div id="resultado"></div>
    </div>
    <!-- JavaScript -->
    <script>
        // Variáveis para acessar o formulário e o elemento de resultado
        const form = document.getElementById("formCadastro");
        const resultado = document.getElementById("resultado");
        // Evento de submit do formulário
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            // Variaveis para armazenar os valores dos inputs
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const idade = document.getElementById("idade").value;
            // Exibindo os dados cadastrados no elemento de resultado
            resultado.innerHTML = `
                <h3>Dados cadastrados:</h3>
                <p><strong>Nome:</strong> ${nome}</p>
                <p><strong>E-mail:</strong> ${email}</p>
                <p><strong>Idade:</strong> ${idade}</p>
            `;
        });
    </script>

</body>
</html>
