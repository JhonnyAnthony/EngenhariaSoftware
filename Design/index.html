<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Protótipo de E0commerce</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo"> Loja MVP </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
            <div class="cart-icon">
                Carrinho <span>(0)</span>
            </div>
        </div>
        <h1>Nossos Produtos</h1>
    </header>
    <main>
        <div class="product-card">
            <img src="./assets/img/tenis.jpg" alt="Tenis de Corrida">
            <h2>Tenis de Spped Pro</h2>
            <p>Conforto e alta performance parar suas corridas diárias.</p>
            <span class="price">R$ 299,99</span>
            <button>Adicionar ao Carrinho</button>
        </div>
    </main>
</body>
</html>
